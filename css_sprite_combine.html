<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sprite 拼接工具</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #3b82f6;
      --accent-600: #2563eb;
      --surface: #f8fafc;
      --shadow: 0 1px 2px rgba(2, 6, 23, 0.05), 0 8px 24px rgba(2, 6, 23, 0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.75));
      backdrop-filter: saturate(180%) blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      /* max-width: 960px; */
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: radial-gradient(120% 120% at 0% 0%, #60a5fa 0%, #a78bfa 55%, #f472b6 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }
    .title { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
    .subtitle { color: var(--muted); font-size: 13px; }

    .container {
      /* max-width: 960px; */
      margin: 24px auto 48px; 
      padding: 0 20px;
      /* display: grid; */
      /* grid-template-columns: 1fr; */
      /* gap: 16px; */
    }

    .card {
      margin-bottom: 20px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card .section { padding: 16px; }
    .section + .section { border-top: 1px solid var(--border); }
    .section h2 { margin: 0 0 10px; font-size: 15px; }
    .muted { color: var(--muted); font-size: 13px; }

    .dropzone {
      display: grid;
      place-items: center;
      padding: 24px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: #fff;
      transition: border-color 120ms ease, background-color 120ms ease;
      text-align: center;
      cursor: pointer;
    }
    .dropzone.dragover {
      border-color: var(--accent);
      background: #f0f7ff;
    }
    .dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dropzone p { margin: 8px 0 0; }
    .drop-actions { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 8px; }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease, color 120ms ease;
    }
    .btn:hover { border-color: #cbd5e1; box-shadow: 0 1px 0 rgba(2,6,23,0.05); }
    .btn:active { transform: translateY(0.5px); }
    .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
    .btn.primary:hover { background: var(--accent-600); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .filelist {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 12px;
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 180px;
      overflow: auto;
    }
    .fileitem { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fileitem strong { color: var(--text); margin-right: 6px; }

    .canvas-wrap { overflow: auto; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .canvas {
      /* max-width: 100%; */
      display: block;
      background: repeating-linear-gradient(45deg, #fafafa, #fafafa 10px, #f5f5f5 10px, #f5f5f5 20px);
      border-radius: 6px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .meta { font-size: 13px; color: var(--muted); }
    .error { color: #dc2626; }

    /* Vue3 预览与配置布局（组件样式在 SFC 内部） */
    [v-cloak] { display: none; }
    .vue-preview {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: stretch;
    }
    .preview-box { border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 12px; width: 100%; display: flex; flex-direction: column; }
    .preview-box > v-anim-frame { display: block; }
    .preview-box > .empty { }
    .cfg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .cfg-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cfg-grid label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; white-space: nowrap; min-width: 92px; }
    .cfg-grid input, .cfg-grid select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 14px; width: 100%; min-width: 0; }

    /* 空态样式 */
    .empty { display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; padding: 20px; background: #fafafa; text-align: center; }
    .empty svg { width: 36px; height: 36px; stroke: #94a3b8; fill: none; stroke-width: 1.5; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo"></div>
      <div>
        <div class="title">CSS Sprite 拼接工具</div>
        <div class="subtitle">拖拽或选择图片，按文件名自动排序后横向拼接并导出 PNG</div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="section">
        <h2>上传图片</h2>
        <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="点击或拖拽上传图片">
          <div>
            <strong>点击或拖拽图片到此上传</strong>
            <p class="muted">将自动按文件名 A → Z 排序，仅支持同尺寸图片。</p>
            <input id="fileInput" type="file" accept="image/*" multiple hidden>
          </div>
        </div>
      </div>
      <div class="section">
        <h2>已选择文件（按文件名排序）</h2>
        <ul id="fileList" class="filelist"></ul>
        <div id="errorMsg" class="muted error" role="alert" style="display:none;"></div>
      </div>
      <div class="section">
        <h2>预览与导出</h2>
        <div class="actions" style="margin-bottom: 10px;">
          <button id="composeBtn" class="btn">重新拼接</button>
          <button id="downloadBtn" class="btn primary" disabled>下载 PNG</button>
          <button id="downloadStreamBtn" class="btn" disabled>无画布导出 PNG（横排不换行）</button>
          <button id="clearBtn" class="btn ghost">清空</button>
          <div class="meta" id="meta" style="margin-left:auto;">未选择图片</div>
        </div>
        <div class="canvas-wrap">
          <div id="canvasEmpty" class="empty">
            <div>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.75 6.75A2.25 2.25 0 0 1 6 4.5h12a2.25 2.25 0 0 1 2.25 2.25v10.5A2.25 2.25 0 0 1 18 19.5H6a2.25 2.25 0 0 1-2.25-2.25V6.75Z"/>
                <path d="M3.75 14.25l4.5-4.5a1.5 1.5 0 0 1 2.121 0l6.879 6.879"/>
                <path d="M15.75 12.75l2.25-2.25"/>
                <circle cx="9.75" cy="8.25" r="1.25"/>
              </svg>
            </div>
          </div>
          <canvas id="canvas" class="canvas" style="display:none;"></canvas>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="section">
        <h2>帧动画预览（Vue3）与配置</h2>
        <div id="vueApp" v-cloak>
          <div class="vue-preview">
            <div class="preview-box">
              <div class="muted" style="margin-bottom:8px;">预览</div>
              <div v-if="!cfg.url" class="empty">
                <div>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3.75 6.75A2.25 2.25 0 0 1 6 4.5h12a2.25 2.25 0 0 1 2.25 2.25v10.5A2.25 2.25 0 0 1 18 19.5H6a2.25 2.25 0 0 1-2.25-2.25V6.75Z"/>
                    <path d="M3.75 14.25l4.5-4.5a1.5 1.5 0 0 1 2.121 0l6.879 6.879"/>
                    <path d="M15.75 12.75l2.25-2.25"/>
                    <circle cx="9.75" cy="8.25" r="1.25"/>
                  </svg>
                </div>
              </div>
              <v-anim-frame v-else
                v-bind="cfg"
                :key="compKey"
                @animiteration="onIter"
                @animend="onEnd"
              />

              <v-anim-frame url="" width="100" height="100" count="10" duration="0.5" loop="infinite" reverse="false" pause="false" unit="px" pointerEvents="auto" @animiteration="" @animend="" />

              <div class="muted" style="margin-top:8px;">{{ statusText }}</div>
            </div>
            <div class="preview-box">
              <div class="muted" style="margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
                <span>组件配置</span>
                <div style="display:flex; gap:8px;">
                  <button class="btn" @click="copyCode">复制 Vue 代码</button>
                  <button class="btn" @click="copyMpxCode">复制 MPX 代码</button>
                </div>
              </div>
              <div class="cfg-grid">
                <div class="cfg-row">
                  <label>url</label>
                  <input v-model="cfg.url" placeholder="sprite 图片地址或 Blob URL" />
                </div>
                <div class="cfg-row">
                  <label>width</label>
                  <input v-model.number="cfg.width" type="number" min="0" />
                </div>
                <div class="cfg-row">
                  <label>height</label>
                  <input v-model.number="cfg.height" type="number" min="0" />
                </div>
                <div class="cfg-row">
                  <label>count</label>
                  <input v-model.number="cfg.count" type="number" min="0" />
                </div>
                <div class="cfg-row">
                  <label>duration (秒/帧)</label>
                  <input v-model.number="cfg.duration" type="number" step="0.01" min="0" />
                </div>
                <div class="cfg-row">
                  <label>loop</label>
                  <input v-model="cfg.loop" placeholder="infinite 或 数字" />
                </div>
                <div class="cfg-row">
                  <label>reverse</label>
                  <select v-model="cfg.reverse">
                    <option :value="false">false</option>
                    <option :value="true">true</option>
                  </select>
                </div>
                <div class="cfg-row">
                  <label>pause</label>
                  <select v-model="cfg.pause">
                    <option :value="false">false</option>
                    <option :value="true">true</option>
                  </select>
                </div>
                <div class="cfg-row">
                  <label>unit</label>
                  <select v-model="cfg.unit">
                    <option value="vw">vw</option>
                    <option value="px">px</option>
                    <option value="vmin">vmin</option>
                    <option value="rpx">rpx(近似)</option>
                  </select>
                </div>
                <div class="cfg-row">
                  <label>pointerEvents</label>
                  <select v-model="cfg.pointerEvents">
                    <option value="auto">auto</option>
                    <option value="none">none</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const dropzone = document.getElementById('dropzone');
      // const chooseBtn = document.getElementById('chooseBtn');
      const fileInput = document.getElementById('fileInput');
      const fileListEl = document.getElementById('fileList');
      const errorMsgEl = document.getElementById('errorMsg');
      const composeBtn = document.getElementById('composeBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const downloadStreamBtn = document.getElementById('downloadStreamBtn');
      const clearBtn = document.getElementById('clearBtn');
      const metaEl = document.getElementById('meta');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      // 提供复制代码功能给 Vue 区域调用（支持 Vue/MPX 两种代码）
      window.__copySpriteCode = async function (cfg, mode) {
        const targetMode = mode === 'mpx' ? 'mpx' : 'vue';
        let code = '';
        if (targetMode === 'mpx') {
          const mpxUnit = ['rpx', 'px', 'vmin'].includes(String(cfg.unit)) ? String(cfg.unit) : 'rpx';
          const attrs = [
            // 小程序里 blob URL 不可用，留空由业务侧填真实地址
            ['url', ''],
            ['width', cfg.width],
            ['height', cfg.height],
            ['count', cfg.count],
            ['duration', cfg.duration],
            ['loop', cfg.loop],
            ['reverse', `{{${Boolean(cfg.reverse)}}}`],
            ['pause', `{{${Boolean(cfg.pause)}}}`],
            ['unit', mpxUnit],
            ['pointerEvents', cfg.pointerEvents],
            ['bind:animiteration', 'onAnimIteration'],
            ['bind:animend', 'onAnimEnd'],
          ];
          const attrStr = attrs
            .map(([k, v]) => `${k}="${String(v)}"`)
            .join(' ');
          code = `<v-anim-frame-3 ${attrStr}></v-anim-frame-3>`;
        } else {
          const attrs = [
            ['url', ''],
            ['width', cfg.width],
            ['height', cfg.height],
            ['count', cfg.count],
            ['duration', cfg.duration],
            ['loop', cfg.loop],
            [':reverse', Boolean(cfg.reverse)],
            [':pause', Boolean(cfg.pause)],
            ['unit', cfg.unit],
            ['pointerEvents', cfg.pointerEvents],
          ];
          const attrStr = attrs
            .map(([k, v]) => `${k}="${String(v)}"`)
            .join(' ');
          code = `<anim-frame ${attrStr} />`;
        }
        try {
          await navigator.clipboard.writeText(code);
          metaEl.textContent = targetMode === 'mpx' ? '已复制 MPX 代码到剪贴板' : '已复制 Vue 代码到剪贴板';
        } catch (e) {
          console.warn('clipboard failed, fallback', e);
          const ta = document.createElement('textarea');
          ta.value = code; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
          metaEl.textContent = targetMode === 'mpx' ? '已复制 MPX 代码到剪贴板' : '已复制 Vue 代码到剪贴板';
        }
      }

      /** @type {{name:string,file:File,url:string,img:HTMLImageElement}[]} */
      let items = [];

      function resetState() {
        items.forEach(i => URL.revokeObjectURL(i.url));
        items = [];
        fileListEl.innerHTML = '';
        errorMsgEl.style.display = 'none';
        errorMsgEl.textContent = '';
        metaEl.textContent = '未选择图片';
        downloadBtn.disabled = true;
        if (downloadStreamBtn) downloadStreamBtn.disabled = true;
        clearCanvas();
      }

      function clearCanvas() {
        canvas.width = 0; canvas.height = 0; // visually clears and resets state
      }

      function setError(msg) {
        errorMsgEl.textContent = msg;
        errorMsgEl.style.display = 'block';
      }

      function clearError() {
        errorMsgEl.textContent = '';
        errorMsgEl.style.display = 'none';
      }

      function naturalSortByName(a, b) {
        return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
      }

      function updateFileList() {
        fileListEl.innerHTML = '';
        items.forEach((it, idx) => {
          const li = document.createElement('li');
          li.className = 'fileitem';
          li.title = it.name;
          li.innerHTML = '<strong>' + (idx + 1) + '.</strong> ' + it.name;
          fileListEl.appendChild(li);
        });
      }

      function loadImageFromURL(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          // Use object URL for local files; no CORS needed
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('图片加载失败'));
          img.src = url;
        });
      }

      // --- PNG 构建工具函数（分块写入） ---
      function writeUint32BE(num) {
        const b = new Uint8Array(4);
        b[0] = (num >>> 24) & 0xff;
        b[1] = (num >>> 16) & 0xff;
        b[2] = (num >>> 8) & 0xff;
        b[3] = num & 0xff;
        return b;
      }
      // CRC32 for PNG chunks
      const CRC_TABLE = (() => {
        const table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) {
            c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          }
          table[n] = c >>> 0;
        }
        return table;
      })();
      function crc32(bytes) {
        let c = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) {
          c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
        }
        return (c ^ 0xffffffff) >>> 0;
      }
      function encodeChunk(typeStr, data) {
        const type = new TextEncoder().encode(typeStr);
        const len = data.length >>> 0;
        const lenBytes = writeUint32BE(len);
        const crcInput = new Uint8Array(type.length + data.length);
        crcInput.set(type, 0);
        crcInput.set(data, type.length);
        const crc = writeUint32BE(crc32(crcInput));
        const out = new Uint8Array(4 + 4 + len + 4);
        out.set(lenBytes, 0);
        out.set(type, 4);
        out.set(data, 8);
        out.set(crc, 8 + len);
        return out;
      }
      function createIHDR(width, height) {
        const data = new Uint8Array(13);
        data.set(writeUint32BE(width), 0);
        data.set(writeUint32BE(height), 4);
        data[8] = 8;  // bit depth
        data[9] = 6;  // color type RGBA
        data[10] = 0; // compression method
        data[11] = 0; // filter method
        data[12] = 0; // interlace none
        return encodeChunk('IHDR', data);
      }

      // 逐行拼接并流式压缩为 PNG（横向不换行），返回 Blob
      async function createSpritePNGBlobStreamHorizontal() {
        if (!window.CompressionStream) {
          setError('当前浏览器不支持 CompressionStream，无法无画布导出 PNG。请使用支持该特性的浏览器或改用普通导出。');
          throw new Error('CompressionStream not supported');
        }
        clearError();
        const count = items.length;
        if (!count) return;
        const singleW = items[0].img.naturalWidth;
        const singleH = items[0].img.naturalHeight;
        const totalW = singleW * count;
        const totalH = singleH;

        // 小画布只读取 1 行像素，避免超大画布
        const scratch = document.createElement('canvas');
        scratch.width = singleW;
        scratch.height = 1;
        const sctx = scratch.getContext('2d', { willReadFrequently: true });
        sctx.imageSmoothingEnabled = false;

        const pngSig = new Uint8Array([137,80,78,71,13,10,26,10]);
        const ihdr = createIHDR(totalW, totalH);

        const deflater = new CompressionStream('deflate');
        const writer = deflater.writable.getWriter();
        const reader = deflater.readable.getReader();

        const pngStream = new ReadableStream({
          async start(controller) {
            try {
              controller.enqueue(pngSig);
              controller.enqueue(ihdr);

              // 异步喂入扫描线
              (async () => {
                for (let y = 0; y < totalH; y++) {
                  // 一行输出缓冲：过滤器字节(0) + RGBA 像素
                  const row = new Uint8Array(1 + totalW * 4);
                  row[0] = 0; // FilterType 0: None
                  for (let i = 0; i < count; i++) {
                    const img = items[i].img;
                    // 从源图截取 1px 高的一行到小画布
                    sctx.clearRect(0, 0, singleW, 1);
                    sctx.drawImage(img, 0, y, singleW, 1, 0, 0, singleW, 1);
                    const data = sctx.getImageData(0, 0, singleW, 1).data;
                    row.set(data, 1 + i * singleW * 4);
                  }
                  await writer.write(row);
                }
                await writer.close();
              })().catch(err => controller.error(err));

              // 读取压缩输出，直接包成多个 IDAT 块写入
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                controller.enqueue(encodeChunk('IDAT', value));
              }
              controller.enqueue(encodeChunk('IEND', new Uint8Array(0)));
              controller.close();
            } catch (e) {
              controller.error(e);
            }
          }
        });

        const blob = await new Response(pngStream).blob();
        return blob;
      }

      async function createSpritePNGBlobFromCanvas() {
        return new Promise((resolve, reject) => {
          if (!canvas.width || !canvas.height) {
            reject(new Error('canvas empty'));
            return;
          }
          if (canvas.toBlob) {
            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error('toBlob failed'));
                return;
              }
              resolve(blob);
            }, 'image/png');
          } else {
            try {
              const dataURL = canvas.toDataURL('image/png');
              const arr = dataURL.split(',');
              const mime = arr[0].match(/:(.*?);/)[1];
              const bstr = atob(arr[1]);
              let n = bstr.length; const u8arr = new Uint8Array(n);
              while (n--) { u8arr[n] = bstr.charCodeAt(n); }
              resolve(new Blob([u8arr], { type: mime }));
            } catch (e) { reject(e); }
          }
        });
      }

      async function buildPreviewBlobURL() {
        try {
          // 优先使用流式拼接，避免超大画布限制
          let blob;
          if (window.CompressionStream) {
            blob = await createSpritePNGBlobStreamHorizontal();
          } else {
            blob = await createSpritePNGBlobFromCanvas();
          }
          const url = URL.createObjectURL(blob);
          return url;
        } catch (e) {
          console.warn('预览 Blob 生成失败，回退 canvas:', e);
          const blob = await createSpritePNGBlobFromCanvas();
          const url = URL.createObjectURL(blob);
          return url;
        }
      }

      async function handleFiles(fileList) {
        if (!fileList || fileList.length === 0) return;
        clearError();

        // Replace state
        resetState();

        // Filter images and sort by filename
        const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) {
          setError('未检测到图片文件');
          return;
        }
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        // Load images and validate dimensions
        const loaded = await Promise.all(files.map(async (file) => {
          const url = URL.createObjectURL(file);
          const img = await loadImageFromURL(url);
          return { name: file.name, file, url, img };
        })).catch((err) => {
          setError('图片加载过程中出现错误');
          return null;
        });
        if (!loaded) return;

        // Dimension check
        const w = loaded[0].img.naturalWidth;
        const h = loaded[0].img.naturalHeight;
        const inconsistent = loaded.some(i => i.img.naturalWidth !== w || i.img.naturalHeight !== h);
        if (inconsistent) {
          loaded.forEach(i => URL.revokeObjectURL(i.url));
          setError('检测到不同尺寸的图片，请确保所有图片宽高一致');
          return;
        }

        items = loaded.sort(naturalSortByName);
        updateFileList();
        metaEl.textContent = items.length + ' 张图片 • 单图 ' + w + '×' + h + ' • 拼接后 ' + (w * items.length) + '×' + h;
        if (downloadStreamBtn) downloadStreamBtn.disabled = false;
        await compose();

        // 自动生成预览并同步到 Vue 组件
        try {
          metaEl.textContent += ' • 正在生成预览…';
          const url = await buildPreviewBlobURL();
          if (window.__VueSprite && typeof window.__VueSprite.setSprite === 'function') {
            window.__VueSprite.setSprite({ url, width: w, height: h, count: items.length });
          }
          metaEl.textContent = items.length + ' 张图片 • 单图 ' + w + '×' + h + ' • 拼接后 ' + (w * items.length) + '×' + h + ' • 预览已更新';
        } catch (e) {
          console.warn('生成预览失败:', e);
        }
      }

      async function compose() {
        if (!items.length) { clearCanvas(); return; }
        // 切换空态
        const empty = document.getElementById('canvasEmpty');
        if (empty) empty.style.display = 'none';
        if (canvas) canvas.style.display = 'block';
        const singleW = items[0].img.naturalWidth;
        const singleH = items[0].img.naturalHeight;
        const count = items.length;

        const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
        const cssW = singleW * count;
        const cssH = singleH;
        // Set backing store size with DPR for crisp output
        canvas.width = cssW * dpr;
        canvas.height = cssH * dpr;
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0); // reset
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, cssW, cssH);

        for (let i = 0; i < count; i++) {
          const x = i * singleW;
          ctx.drawImage(items[i].img, x, 0, singleW, singleH);
        }
        ctx.restore();
        downloadBtn.disabled = false;
      }

      function downloadPNG() {
        if (!canvas.width || !canvas.height) return;
        const filename = 'sprite.png';
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 0);
          }, 'image/png');
        } else {
          // Fallback (older browsers)
          const dataURL = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = dataURL; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        }
      }

      // Drag & Drop
      ['dragenter', 'dragover'].forEach(evt => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach(evt => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.remove('dragover');
        });
      });
      dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (!dt) return;
        handleFiles(dt.files);
      });

      // File input
      // 点击/键盘触发文件选择
      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          fileInput.click();
        }
      });
      fileInput.addEventListener('change', () => handleFiles(fileInput.files));

      // Actions
      composeBtn.addEventListener('click', () => compose());
      downloadBtn.addEventListener('click', () => downloadPNG());
      if (downloadStreamBtn) {
        // 兼容性禁用
        if (!window.CompressionStream) {
          downloadStreamBtn.disabled = true;
          downloadStreamBtn.title = '当前浏览器不支持 CompressionStream';
        }
        downloadStreamBtn.addEventListener('click', () => {
          createSpritePNGBlobStreamHorizontal()
            .then((blob) => {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url; a.download = 'sprite.png'; document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 0);
            })
            .catch(err => setError('无画布导出失败：' + (err && err.message || err)));
        });
      }
      clearBtn.addEventListener('click', () => resetState());

      // Initial
      resetState();
    })();
  </script>

  <!-- Vue3 + vue3-sfc-loader（加载外部 SFC 组件） -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
  <script type="module">
    const { createApp, computed, ref } = Vue
    const { loadModule } = window['vue3-sfc-loader']

    const options = {
      moduleCache: { vue: Vue },
      getFile(url) { return fetch(url).then(r => { if (!r.ok) throw new Error(url + ' load failed'); return r.text() }) },
      addStyle(textContent) { const style = document.createElement('style'); style.textContent = textContent; document.head.appendChild(style) }
    }

    ;(async () => {
      // 注意：相对当前 HTML 的路径
      let VAnimFrame
      const tryPaths = [
        './v-anim-frame-2/v-anim-frame.vue',
        '../v-anim-frame-2/v-anim-frame.vue'
      ]
      for (const p of tryPaths) {
        try { VAnimFrame = await loadModule(p, options); break } catch (_) {}
      }
      if (!VAnimFrame) throw new Error(`${tryPaths.join(', ')} load failed`)

      const app = createApp({
        components: { VAnimFrame },
        setup() {
          const cfg = ref({
            reverse: false,
            unit: 'vw',
            pause: false,
            url: '',
            count: 0,
            width: 0,
            height: 0,
            duration: 0.5,
            loop: 'infinite',
            pointerEvents: 'auto',
          })
          const statusText = ref('等待生成精灵图…')
          const compKey = computed(() => [
            cfg.value.url, cfg.value.width, cfg.value.height, cfg.value.count,
            cfg.value.duration, cfg.value.loop, cfg.value.reverse, cfg.value.pause
          ].join('|'))
          let lastBlobUrl = ''

          function setSprite({ url, width, height, count }) {
            if (lastBlobUrl && lastBlobUrl.startsWith('blob:')) {
              try { URL.revokeObjectURL(lastBlobUrl) } catch (e) {}
            }
            lastBlobUrl = url
            cfg.value.url = url
            cfg.value.width = width
            cfg.value.height = height
            cfg.value.count = count
            statusText.value = `预览已更新：${width}×${height}，${count} 帧`
          }
          function onIter(e) {}
          function onEnd(e) {}

          async function copyCode() {
            if (window.__copySpriteCode) await window.__copySpriteCode({ ...cfg.value, url: '' })
          }
          async function copyMpxCode() {
            if (window.__copySpriteCode) await window.__copySpriteCode({ ...cfg.value }, 'mpx')
          }

          window.__VueSprite = { setSprite }
          return { cfg, statusText, onIter, onEnd, compKey, copyCode, copyMpxCode }
        }
      })
      app.component('v-anim-frame', VAnimFrame)
      app.mount('#vueApp')
    })();
  </script>
